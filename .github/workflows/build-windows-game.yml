name: Build Windows game

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: monomial-finite-cell/requirements-windows-build.txt

      - name: Build and smoke-test executable
        working-directory: monomial-finite-cell
        run: ./build_windows.ps1 -BasePython python

      - name: Upload Windows executable and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Monomial-Finite-Cell-Game-Windows-x64-v0.1.0
          path: |
            monomial-finite-cell/dist/Monomial Finite Cell Game.exe
            monomial-finite-cell/dist/Monomial-Finite-Cell-Game-Windows-x64-v0.1.0.zip
          if-no-files-found: error
